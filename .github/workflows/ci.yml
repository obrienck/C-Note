name: CI

# Fast feedback on every push and pull request to main: typecheck, build the
# renderer and Electron bundles, and make sure the app still packages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build renderer/main
        run: npm run build

      - name: Package (unpacked, no publish)
        run: npx electron-builder --linux --dir --publish never
